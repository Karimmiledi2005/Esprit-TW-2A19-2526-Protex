<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation - Protex</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ptx-orange: #FF6B1A;
            --ptx-navy: #1A3A7A;
            --ptx-dark: #0a0f1e;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #12244a, #0a0f1e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated Background Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: orbFloat 20s infinite alternate;
        }
        .orb-1 { width: 400px; height: 400px; background: rgba(255, 107, 26, 0.2); top: -100px; right: -100px; }
        .orb-2 { width: 350px; height: 350px; background: rgba(26, 58, 122, 0.3); bottom: -50px; left: -50px; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: rgba(0, 180, 216, 0.15); top: 50%; left: 10%; animation-delay: -10s; }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        .conf-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px;
            width: 480px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: cardAppear 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SVG Checkmark Animation */
        .checkmark-svg {
            width: 100px;
            height: 100px;
            margin-bottom: 24px;
        }

        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: #4bb543;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke: #4bb543;
            stroke-width: 3;
            fill: none;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }

        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }

        .conf-title {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 12px;
            background: linear-gradient(to right, #fff, rgba(255,255,255,0.7));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .conf-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--ptx-orange);
            border-radius: 2px;
            animation: progressFill 4s linear forwards;
        }

        @keyframes progressFill {
            to { width: 100%; }
        }

        .redirect-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 24px;
        }

        .btn-connect {
            display: inline-block;
            background: var(--ptx-orange);
            color: #fff;
            padding: 12px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 26, 0.3);
        }

        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 26, 0.5);
            background: #ff8c00;
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="conf-card">
        <svg class="checkmark-svg" viewBox="0 0 52 52">
            <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>

        <h1 class="conf-title">Opération réussie !</h1>
        <p id="ptx-subtitle" class="conf-subtitle">Votre requête a été traitée avec succès.</p>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <p class="redirect-text">Redirection automatique dans 4 secondes...</p>

        <a href="login.html" class="btn-connect">Aller à la connexion</a>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type');
            const subtitleEl = document.getElementById('ptx-subtitle');

            const messages = {
                'register': "Votre compte Protex a été créé avec succès.",
                'reset': "Votre mot de passe a été réinitialisé.",
                'update': "Votre profil a été mis à jour."
            };

            if (type && messages[type]) {
                subtitleEl.textContent = messages[type];
            }

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 4000);
        })();
    </script>
</body>
</html>
